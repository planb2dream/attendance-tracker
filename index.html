/* Clean in-app alert popup */
.app-alert-overlay{
  position:fixed; inset:0; z-index:99999;
  display:none; align-items:center; justify-content:center;
  background:rgba(0,0,0,.55); padding:20px;
}
.app-alert-overlay.show{display:flex;}
.app-alert-box{
  width:min(420px,100%); border-radius:18px;
  padding:22px; background:var(--card,#1d2a29);
  color:var(--ink); border:1px solid var(--line);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}
.app-alert-title{font-size:20px;font-weight:700;margin:0 0 10px;}
.app-alert-message{font-size:16px;line-height:1.5;margin:0 0 20px;opacity:.9;}
.app-alert-actions{display:flex;justify-content:flex-end;}
.app-alert-ok{
  border:0;border-radius:10px;padding:10px 22px;font-size:16px;font-weight:700;
  cursor:pointer;background:var(--primary);color:#fff;
}


/* Simple scroll-wheel 12-hour time picker */
.timePicker{min-width:112px;flex:1}
.timeWheelTrigger{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font-weight:700;text-align:center}
.timeWheelTrigger::after{content:"⌄";float:right;color:var(--soft);font-weight:400}
.wheelTimeOverlay{position:fixed;inset:0;z-index:120000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.5)}
.wheelTimeDialog{width:min(430px,100%);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 70px rgba(0,0,0,.38);overflow:hidden}
.wheelTimeTitle{padding:18px 20px 8px;font-size:18px;font-weight:900;text-align:center}
.wheelWrap{position:relative;display:grid;grid-template-columns:1fr 1fr .9fr;gap:4px;padding:14px 16px;height:220px}
.wheelWrap:before,.wheelWrap:after{content:"";position:absolute;left:16px;right:16px;height:52px;pointer-events:none;z-index:2}
.wheelWrap:before{top:84px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--primarySoft) 55%,transparent);border-radius:12px}
.wheelWrap:after{top:14px;height:192px;background:linear-gradient(to bottom,var(--card) 0%,transparent 24%,transparent 76%,var(--card) 100%)}
.wheelCol{position:relative;z-index:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:84px 2px;overscroll-behavior:contain}
.wheelCol::-webkit-scrollbar{display:none}
.wheelItem{height:52px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:25px;color:var(--soft);font-weight:500}
.wheelItem.selected{color:var(--ink);font-weight:900}
.wheelActions{display:flex;justify-content:flex-end;gap:10px;padding:10px 18px 18px}
.wheelBtn{padding:11px 20px;border-radius:11px;font-weight:800;border:1px solid var(--line)}
.wheelCancel{background:var(--bg);color:var(--ink)}
.wheelOk{background:var(--primary);color:#fff;border-color:var(--primary)}
@media(max-width:560px){.timePicker{width:100%;min-width:0}.wheelItem{font-size:23px}}


/* App-owned dialogs: never use browser/WebView alert or confirm, so no site URL is shown */
.appDialogOverlay{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.52)}
.appDialogOverlay.show{display:flex}
.appDialog{width:min(430px,100%);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:22px}
.appDialogTitle{font-size:20px;font-weight:900;margin:0 0 10px;color:var(--ink)}
.appDialogMessage{font-size:15px;line-height:1.55;color:var(--soft);margin:0 0 20px;white-space:pre-wrap}
.appDialogActions{display:flex;justify-content:flex-end;gap:10px}
.appDialogBtn{padding:10px 18px;border-radius:11px;font-weight:800;border:1px solid var(--line)}
.appDialogCancel{background:var(--bg);color:var(--ink)}
.appDialogOk{background:var(--primary);color:#fff;border-color:var(--primary)}

function subjectOptions(selected=""){let opts=SUBJECT_LIST.map(x=>`<option value="${esc(x)}" ${x===selected?"selected":""}>${esc(x)}</option>`).join("");return `<select id="subjectSelect" class="input"><option value="">Select subject</option>${opts}<option value="__OTHER__">Other (type manually)</option></select><div id="otherSubjectWrap" class="hidden"><label class="label">Other subject / activity</label><input id="otherSubject" class="input" placeholder="Type carefully"></div>`}

function applyTheme(){
  const systemDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  let t=state.settings.theme;
  if(t!=="light"&&t!=="dark"&&t!=="system")t="system";
  const resolved=t==="system"?(systemDark?"dark":"light"):t;
  document.documentElement.setAttribute("data-theme",resolved);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute("content",resolved==="dark"?"#121817":"#F4F6F5");
}
function watchSystemTheme(){
  if(!window.matchMedia)return;
  const media=window.matchMedia("(prefers-color-scheme: dark)");
  const update=()=>{if(state.settings.theme==="system"){applyTheme();render()}};
  if(media.addEventListener)media.addEventListener("change",update);

function combinedEveningRows(st,filter="all"){

function settingsTab(){let s=state.settings;return `<div class="card formCard"><b>⚙️ Settings</b><label class="label">Name</label><input id="setName" class="input" value="${esc(s.name)}"><label class="label">Course / Academic part</label><input id="setCourse" class="input" value="${esc(s.course)}"><label class="label">Minimum required attendance (%)</label><input id="setRequired" class="input" type="number" min="1" max="100" value="${s.required}"><p class="small" style="margin-top:12px">🔒 Attendance logging time is fixed at 6:00 AM and cannot be changed.</p><label class="label">Clinical Posting Roll Number</label>${s.rollLocked&&s.rollNumber?`<div class="input" style="display:flex;align-items:center;justify-content:space-between"><b>${esc(s.rollNumber)}</b><span>🔒 Permanently locked</span></div><p class="small">Your roll number is permanently saved and cannot be changed.</p>`:`<input id="setRoll" class="input" type="number" min="1" max="100" value="${esc(s.rollNumber||"")}" placeholder="Enter your roll number (1–100)"><p class="small">⚠️ Check carefully. Once saved, your roll number will be permanently locked.</p><div style="margin-top:10px"><button class="btn" type="button" data-act="saveRoll">Save & Lock Roll Number</button></div>`}<p class="small">The app automatically switches to the new roll-number group arrangement from 9 Aug 2027.</p><label class="label">Appearance</label><select id="setTheme" class="input"><option value="system" ${s.theme==="system"?"selected":""}>System default</option><option value="light" ${s.theme==="light"?"selected":""}>Light</option><option value="dark" ${s.theme==="dark"?"selected":""}>Dark</option></select><div style="margin-top:14px"><button class="btn" data-act="saveSettings">Save settings</button></div></div><div class="card formCard"><b>📚 Schedule</b><p class="small">Schedule changes apply to new/unsaved classes. Saved attendance keeps its original subject permanently for accurate history and statistics.</p><button class="btn outline" type="button" onclick="openManageSchedule()">Manage schedule</button></div><p class="small" style="text-align:center">Tracking starts on 7 Sep 2026 and continues indefinitely.</p>`}

document.addEventListener("click",async e=>{let el=e.target.closest("[data-act]");if(!el)return;let a=el.dataset.act;if(a==="tab"){draftDate=null;draftStatus={};state.tab=el.dataset.v;save();render()}else if(a==="prev"){draftDate=null;draftStatus={};let d=add(parseKey(state.viewDate),-1);state.viewDate=key(d<START_DATE?START_DATE:d);save();render()}else if(a==="next"){draftDate=null;draftStatus={};state.viewDate=key(add(parseKey(state.viewDate),1));save();render()}else if(a==="today"){draftDate=null;draftStatus={};state.viewDate=key(today());save();render()}else if(a==="pickDate"||a==="dateInput")datePicker();else if(a==="confirmDate"){let inp=document.getElementById("pickerDate");if(inp&&inp.value){draftDate=null;draftStatus={};state.viewDate=inp.value;state.tab="log";save();document.querySelectorAll(".modal").forEach(m=>m.remove());render()}}else if(a==="status")setStatus(el.dataset.k,el.dataset.v);else if(a==="saveAttendance")saveAttendance(state.viewDate);else if(a==="holiday")toggleHoliday(state.viewDate);else if(a==="saveNote")setNote(state.viewDate,document.getElementById("dayNote").value);else if(a==="editClass")classModal(Number(el.dataset.i));else if(a==="addExtra")extraModal();else if(a==="openTimeWheel"){let box=el.closest(".timePicker");if(box)openTimeWheel(box)}else if(a==="saveClassEdit"){let i=Number(el.dataset.i),dk=state.viewDate,base=(state.settings.schedule[parseKey(dk).getDay()]||[]).length,sub=selectedSubject(),st=readTimePicker("actualStart"),en=readTimePicker("actualEnd");if(!sub||!st||!en){toast("Enter subject and times");return}if(i<base){state.overrides[dk]=state.overrides[dk]||{};state.overrides[dk][i]={subject:sub,start:st,end:en}}else{let j=i-base;state.extraClasses[dk][j]=[st,en,sub]}save();document.querySelectorAll(".modal").forEach(m=>m.remove());render();toast("Actual class saved")}else if(a==="restoreClass"){let dk=state.viewDate,i=Number(el.dataset.i);if(state.overrides[dk])delete state.overrides[dk][i];save();document.querySelectorAll(".modal").forEach(m=>m.remove());render();toast("Scheduled class restored")}else if(a==="saveExtra"){let dk=state.viewDate,sub=selectedSubject(),st=readTimePicker("extraStart"),en=readTimePicker("extraEnd");if(!sub||!st||!en){toast("Enter subject and times");return}state.extraClasses[dk]=state.extraClasses[dk]||[];state.extraClasses[dk].push([st,en,sub]);save();document.querySelectorAll(".modal").forEach(m=>m.remove());render();toast("Extra class added")}else if(a==="removeExtra"){let dk=state.viewDate,i=Number(el.dataset.i),base=(state.settings.schedule[parseKey(dk).getDay()]||[]).length,j=i-base;if(j<0||!state.extraClasses[dk]||!state.extraClasses[dk][j]){toast("Extra class not found");return}if(!attendanceEditable(dk,i)){toast("Saved past classes are locked");return}if(!await appConfirm("Delete this extra class? This will remove the extra class and its attendance entry for this date.","Delete extra class?"))return;state.extraClasses[dk].splice(j,1);let shiftStore=obj=>{if(!obj)return;let updates=[];Object.keys(obj).forEach(k=>{if(!k.startsWith(dk+"-"))return;let n=Number(k.slice(dk.length+1));if(!Number.isFinite(n)||n<i)return;if(n===i)updates.push([k,null]);else updates.push([k,dk+"-"+(n-1),obj[k]])});updates.forEach(x=>{if(x[1]===null){delete obj[x[0]]}else{delete obj[x[0]];obj[x[1]]=x[2]}})};shiftStore(state.status);shiftStore(state.records);shiftStore(draftStatus);save();document.querySelectorAll(".modal").forEach(m=>m.remove());render();toast("Extra class deleted");}else if(a==="filter"){state.statsFilter=el.dataset.v;render()}else if(a==="calPrev"){let d=parseKey(state.calendarMonth);state.calendarMonth=key(new Date(d.getFullYear(),d.getMonth()-1,1));save();render()}else if(a==="calNext"){let d=parseKey(state.calendarMonth);state.calendarMonth=key(new Date(d.getFullYear(),d.getMonth()+1,1));save();render()}else if(a==="calPick"){draftDate=null;draftStatus={};state.viewDate=el.dataset.v;state.tab="log";save();render()}else if(a==="saveSettings"){state.settings.name=document.getElementById("setName").value.trim()||"Student";state.settings.course=document.getElementById("setCourse").value.trim()||"Course";state.settings.required=Math.max(1,Math.min(100,Number(document.getElementById("setRequired").value)||75));state.settings.unlockHour=6;state.settings.theme=document.getElementById("setTheme").value;save();applyTheme();render();toast("Settings saved")}else if(a==="saveRoll"){if(state.settings.rollLocked){return}let rollInput=document.getElementById("setRoll"),rn=(rollInput?rollInput.value:"").trim();if(!/^(?:[1-9]|[1-9][0-9]|100)$/.test(rn)){toast("Enter a valid roll number (1–100)");return}if(!await appConfirm("Confirm roll number "+rn+"? Once saved, it cannot be changed.","Save & Lock Roll Number"))return;state.settings.rollNumber=rn;state.settings.rollLocked=true;save();render();toast("Roll number saved and locked")}else if(a==="schedule")scheduleModal();else if(a==="closeModal"){document.querySelectorAll(".modal").forEach(m=>m.remove())}else if(a==="addSession"){let box=document.getElementById("sch"+el.dataset.day),i=box.children.length;box.insertAdjacentHTML("beforeend",scheduleRow(el.dataset.day,i,["09:00","10:00","New Subject"]))}else if(a==="removeSession"){el.parentElement.remove()}else if(a==="saveSchedule"){let ns={};for(let day=1;day<=6;day++){ns[day]=[...document.querySelectorAll("#sch"+day+" > .schRow")].map(r=>{let sub=r.querySelector(".schSubject").value;if(sub==="__OTHER__")sub=r.querySelector(".schOther").value.trim();return [readTimePicker(r.querySelector(".schStart")),readTimePicker(r.querySelector(".schEnd")),sub]}).filter(x=>x[0]&&x[1]&&x[2])}state.settings.schedule=ns;save();document.querySelectorAll(".modal").forEach(m=>m.remove());render();toast("Schedule saved and will be used for future unsaved classes")}});

// Robust Manage Schedule controls (direct handlers; independent of delegated clicks)
function openManageSchedule(){
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  const s=state.settings.schedule||{};
  let html='<div class="modal" id="manageScheduleModal"><div class="modalBox">'
    +'<div class="row" style="justify-content:space-between"><b>Manage weekly schedule</b><button type="button" class="btn outline" onclick="closeManageSchedule()">Close</button></div>'
    +'<p class="small">Edit your timetable. Saved attendance is never changed. The updated schedule is used for future and unsaved classes.</p>';
  for(let day=1;day<=6;day++){
    html+='<div class="formCard card"><b>'+DAYS[day]+'</b><div id="freshSch'+day+'">';
    (s[day]||[]).forEach((x,i)=>html+=freshScheduleRow(day,i,x));
    html+='</div><button type="button" class="btn soft" onclick="addFreshScheduleRow('+day+')">+ Add class</button></div>';
  }
  html+='<div class="row"><button type="button" class="btn grow" onclick="saveManageSchedule()">Save schedule</button><button type="button" class="btn outline" onclick="closeManageSchedule()">Cancel</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}
function freshScheduleRow(day,i,x){
  const opts=SUBJECT_LIST.map(v=>'<option value="'+esc(v)+'" '+(v===x[2]?'selected':'')+'>'+esc(v)+'</option>').join('')+'<option value="__OTHER__" '+(!SUBJECT_LIST.includes(x[2])?'selected':'')+'>Other (type manually)</option>';
  const other=SUBJECT_LIST.includes(x[2])?'':'<input class="input freshOther" value="'+esc(x[2])+'" placeholder="Other subject">';
  return '<div class="freshSchRow" style="margin:8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap">'
    +timePicker('freshStart_'+day+'_'+i,x[0],'freshStart')
    +timePicker('freshEnd_'+day+'_'+i,x[1],'freshEnd')
    +'<select class="input freshSubject" style="flex:1;min-width:180px" onchange="freshOtherToggle(this)">'+opts+'</select>'+other
    +'<button type="button" class="btn outline" onclick="this.closest(&quot;.freshSchRow&quot;).remove()">×</button></div>';
}
function freshOtherToggle(sel){
  const row=sel.closest('.freshSchRow'); let old=row.querySelector('.freshOther');
  if(sel.value==='__OTHER__'&&!old){sel.insertAdjacentHTML('afterend','<input class="input freshOther" placeholder="Other subject">');}
  if(sel.value!=='__OTHER__'&&old)old.remove();
}
function addFreshScheduleRow(day){document.getElementById('freshSch'+day).insertAdjacentHTML('beforeend',freshScheduleRow(day,0,['09:00','10:00',SUBJECT_LIST[0]]));}
function closeManageSchedule(){const m=document.getElementById('manageScheduleModal');if(m)m.remove();}
function saveManageSchedule(){
  const ns={};
  for(let day=1;day<=6;day++){
    ns[day]=[...document.querySelectorAll('#freshSch'+day+' .freshSchRow')].map(r=>{
      const subSel=r.querySelector('.freshSubject');
      const sub=subSel.value==='__OTHER__'?(r.querySelector('.freshOther')?.value.trim()||''):subSel.value;
      return [readTimePicker(r.querySelector('.freshStart')),readTimePicker(r.querySelector('.freshEnd')),sub];
    }).filter(x=>x[0]&&x[1]&&x[2]);
  }
  state.settings.schedule=ns;
  save(); closeManageSchedule(); render(); toast('Schedule saved successfully');
}
window.openManageSchedule=openManageSchedule;window.closeManageSchedule=closeManageSchedule;window.saveManageSchedule=saveManageSchedule;window.addFreshScheduleRow=addFreshScheduleRow;window.freshOtherToggle=freshOtherToggle;


function showAppAlert(message, title){
  const overlay=document.getElementById('appAlertOverlay');
  const titleEl=document.getElementById('appAlertTitle');
  const msgEl=document.getElementById('appAlertMessage');
  if(!overlay) return;
  titleEl.textContent=title || '⚠️ Notice';
  msgEl.textContent=message || '';
  overlay.classList.add('show');
}
document.addEventListener('click', function(e){
  if(e.target && (e.target.id==='appAlertOk' || e.target.id==='appAlertOverlay')){
    document.getElementById('appAlertOverlay')?.classList.remove('show');
  }
});


function appConfirm(message,title="Confirmation"){
  return new Promise(resolve=>{
    const overlay=document.getElementById("appDialogOverlay");
    const titleEl=document.getElementById("appDialogTitle");
    const messageEl=document.getElementById("appDialogMessage");
    const cancel=document.getElementById("appDialogCancel");
    const ok=document.getElementById("appDialogOk");
    if(!overlay){resolve(false);return}
    titleEl.textContent=title;
    messageEl.textContent=message;
    overlay.classList.add("show");
    overlay.setAttribute("aria-hidden","false");
    let finished=false;
    const finish=value=>{
      if(finished)return;
      finished=true;
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden","true");
      cancel.removeEventListener("click",onCancel);
      ok.removeEventListener("click",onOk);
      overlay.removeEventListener("click",onOverlay);
      document.removeEventListener("keydown",onKey);
      resolve(value);
    };
    const onCancel=()=>finish(false);
    const onOk=()=>finish(true);
    const onOverlay=e=>{if(e.target===overlay)finish(false)};
    const onKey=e=>{if(e.key==="Escape")finish(false);if(e.key==="Enter")finish(true)};
    cancel.addEventListener("click",onCancel);
    ok.addEventListener("click",onOk);
    overlay.addEventListener("click",onOverlay);
    document.addEventListener("keydown",onKey);
    setTimeout(()=>ok.focus(),0);
  });
}
