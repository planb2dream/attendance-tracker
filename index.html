<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#1d2730;--soft:#69737d;--line:#dfe5e2;--primary:#2a5c54;--primarySoft:#e5f0ed;--green:#248c5b;--greenSoft:#e6f5ec;--red:#bf4c3b;--redSoft:#fae9e6;--yellow:#9a7b1f;--yellowSoft:#f7f0d7;--purple:#725aa7;--purpleSoft:#eee9f7;--shadow:0 4px 18px rgba(20,35,30,.06)}
[data-theme="dark"]{--bg:#121817;--card:#1b2421;--ink:#edf3ef;--soft:#aab6b0;--line:#2d3935;--primary:#72b8a8;--primarySoft:#203b35;--green:#67c98e;--greenSoft:#183829;--red:#ef8a7b;--redSoft:#412522;--yellow:#d5b95c;--yellowSoft:#3d3418;--purple:#b6a1e4;--purpleSoft:#322a45;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app{margin:0;min-height:100%;background:var(--bg)}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}button:disabled{cursor:not-allowed}.app{min-height:100vh;background:var(--bg)}.header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);padding:16px 16px 10px}.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800}.sub{font-size:12px;color:var(--soft);margin:3px 0}.container{padding:0 14px 92px;max-width:760px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.datebar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:7px;margin:6px 0 10px}.iconbtn{width:42px;height:42px;border-radius:12px;background:transparent;color:var(--ink);font-size:28px}.datecenter{text-align:center}.datecenter b{display:block;font-size:16px}.datecenter span{font-size:12px;color:var(--soft)}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.btn{padding:11px 13px;border-radius:12px;background:var(--primary);color:white;font-weight:700}.btn.soft{background:var(--primarySoft);color:var(--primary)}.btn.outline{background:var(--card);border:1px solid var(--line);color:var(--ink)}.todayonly{display:none}.banner{padding:10px 12px;border-radius:13px;margin:10px 0;font-size:12px;display:flex;gap:8px;align-items:center}.banner.info{background:var(--primarySoft);color:var(--primary)}.banner.warn{background:var(--yellowSoft);color:var(--yellow)}.banner.lock{background:var(--purpleSoft);color:var(--purple)}.progressCard{padding:14px;margin-bottom:10px}.progressHead{display:flex;justify-content:space-between;align-items:center}.progressHead b{font-size:14px}.progressText{font-size:12px;color:var(--soft)}.progress{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}.progress>i{display:block;height:100%;width:0;background:var(--primary);border-radius:99px}.holiday{width:100%;padding:11px;border-radius:13px;background:var(--purpleSoft);color:var(--purple);font-weight:700;margin:0 0 10px}.session{padding:13px;margin:9px 0;border-left:4px solid var(--primary)}.sessionTop{display:flex;justify-content:space-between;gap:10px}.sessionName{font-weight:800;font-size:16px}.sessionTime,.small{font-size:12px;color:var(--soft)}.locktag{font-size:11px;color:var(--soft);white-space:nowrap}.statusRow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.status{min-height:54px;border-radius:11px;font-size:13px;font-weight:800;border:1px solid #b9bec4;background:#e2e5e8;color:#6d747c;transition:.15s;line-height:1.25}.status .statusIcon{font-size:16px;display:block;margin-bottom:2px}.status.active{background:#e2e5e8!important}.status.green.active{color:#168a4a!important;border-color:#168a4a!important}.status.red.active{color:#c8372d!important;border-color:#c8372d!important}.status.gray.active{color:#3f464d!important;border-color:#7b838b!important}.status:disabled{opacity:.55}.status:not(.active){color:#6d747c!important}.saveAttendance{width:100%;margin:12px 0 4px;background:var(--primary);color:#fff;font-weight:800;padding:13px;border-radius:13px}.madeby{text-align:center;color:var(--soft);font-size:12px;padding:18px 0 10px;font-weight:700}.statsHero{padding:20px;text-align:center;margin-bottom:10px}.ring{width:126px;height:126px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:conic-gradient(var(--primary) var(--p),var(--line) 0)}.ringIn{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:25px;font-weight:900}.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}.metric{padding:13px;text-align:center}.metric b{font-size:21px}.metric span{display:block;font-size:11px;color:var(--soft);margin-top:3px}.sectionTitle{font-weight:900;font-size:16px;margin:16px 2px 8px}.subject{padding:14px;margin:9px 0}.subjectHead{display:flex;justify-content:space-between;gap:10px}.subjectName{font-weight:800}.pct{font-weight:900}.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 8px}.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}.subjectMeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px;font-size:11px;color:var(--soft)}.safe{color:var(--green)}.warning{color:var(--yellow)}.danger{color:var(--red)}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 8px}.filter{padding:8px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--soft);font-size:12px;white-space:nowrap}.filter.active{background:var(--primary);color:#fff;border-color:var(--primary)}.calendar{padding:12px}.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calDow{text-align:center;font-size:10px;color:var(--soft);padding-bottom:4px}.calDay{aspect-ratio:1;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:11px;color:var(--ink);position:relative}.calDay.empty{visibility:hidden}.calDay.today{outline:2px solid var(--primary)}.dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--soft)}.dot.good{background:var(--green)}.dot.bad{background:var(--red)}.dot.mix{background:var(--yellow)}.dot.holiday{background:var(--purple)}.formCard{padding:14px;margin:10px 0}.label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}.input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink)}textarea{min-height:80px;resize:vertical}.noteBox{padding:12px;margin:10px 0}.noteBox h3{margin:0 0 8px;font-size:14px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom))}.nav button{flex:1;background:transparent;color:var(--soft);padding:6px 2px;font-size:11px}.nav button b{display:block;font-size:21px;line-height:23px}.nav button.active{color:var(--primary);font-weight:800}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:grid;place-items:end center;padding:12px}.modalBox{width:min(700px,100%);background:var(--card);border-radius:20px;padding:18px;max-height:88vh;overflow:auto}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--card);padding:11px 15px;border-radius:99px;font-size:12px;box-shadow:var(--shadow)}@media(min-width:620px){.statusRow{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div id="app"></div>
<script>
"use strict";
const START_DATE=new Date(2026,8,7), OLD_KEY="attendance-tracker-data-v1", KEY="attendance-tracker-data-v2";
const STATUS={ATTENDED:"attended",ABSENT:"absent",LEAVE:"leave",NOT_HELD:"not_held"};
let draftDate=null,draftStatus={};
const DEFAULT_SCHEDULE={1:[["09:00","10:00","General Medicine"],["10:00","11:00","OBG"],["11:00","14:00","Clinical Posting"],["15:00","17:00","General Medicine"]],2:[["09:00","10:00","General Medicine"],["10:00","11:00","General Surgery"],["11:00","14:00","Clinical Posting"],["15:00","17:00","OBG"]],3:[["09:00","10:00","General Surgery"],["10:00","11:00","Pediatrics"],["11:00","14:00","Clinical Posting"],["15:00","17:00","General Surgery"]],4:[["09:00","10:00","ENT"],["10:00","11:00","Psychiatry"],["11:00","14:00","Clinical Posting"],["15:00","16:00","Resp. Medicine / Radiodiagnosis"],["16:00","17:00","Pediatrics / Anesthesia"]],5:[["09:00","10:00","EYE"],["10:00","11:00","Dermatology"],["11:00","14:00","Clinical Posting"],["15:00","16:00","Orthopedics / OBG"],["16:00","17:00","General Medicine"]],6:[["09:00","10:00","OBG"],["10:00","11:00","Orthopedics"],["11:00","12:00","General Surgery"],["12:00","14:00","AETCOM / Pandemic Module"],["15:00","17:00","Monthly Assessment"]]};
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function clone(x){return JSON.parse(JSON.stringify(x))}function pad(n){return String(n).padStart(2,"0")}function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}function parseKey(k){let p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function today(){let d=new Date();d.setHours(0,0,0,0);return d}function fmt(d){return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}function monthFmt(d){return d.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}function time(s){let[h,m]=s.split(":").map(Number),ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+pad(m)+" "+ap}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function defaultState(){return {status:{},holidays:{},notes:{},tab:"log",viewDate:key(today()),calendarMonth:key(new Date(today().getFullYear(),today().getMonth(),1)),statsFilter:"all",settings:{name:"Sharad Sourav",course:"3rd Prof Part-II",required:75,unlockHour:6,theme:"system",schedule:clone(DEFAULT_SCHEDULE)}}}
let state=defaultState();
function load(){try{let raw=localStorage.getItem(KEY);if(raw){state={...defaultState(),...JSON.parse(raw)};state.settings={...defaultState().settings,...state.settings};state.settings.unlockHour=6;return}let old=localStorage.getItem(OLD_KEY);if(old){let o=JSON.parse(old);state.status=o.status||{};state.holidays=o.holidays||{};save()}}catch(e){console.warn(e)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function applyTheme(){let t=state.settings.theme;if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)}
function editable(k){let d=parseKey(k),t=today();if(d<START_DATE)return false;if(d.getTime()!==t.getTime())return false;return new Date().getHours()>=Number(state.settings.unlockHour||0)}
function subjects(){let set=new Set;Object.values(state.settings.schedule).forEach(a=>(a||[]).forEach(s=>set.add(s[2])));return [...set]}
function sessionsFor(d){return state.settings.schedule[d.getDay()]||[]}
function sessionKey(dateKey,i){return dateKey+"-"+i}
function statusOf(dateKey,i){return state.status[sessionKey(dateKey,i)]}
function draftValue(k){return Object.prototype.hasOwnProperty.call(draftStatus,k)?draftStatus[k]:state.status[k]}
function ensureDraft(dk){if(draftDate!==dk){draftDate=dk;draftStatus={}}}
function setStatus(k,v){let dk=k.slice(0,10);if(!editable(dk))return;ensureDraft(dk);let current=draftValue(k);if(current===v)delete draftStatus[k];else draftStatus[k]=v;render()}
function saveAttendance(dk){if(!editable(dk))return;ensureDraft(dk);let changes=Object.keys(draftStatus);if(!changes.length){toast("No attendance changes to save");return}if(!confirm("Save the selected attendance for today?"))return;changes.forEach(k=>{let v=draftStatus[k];if(v)state.status[k]=v;else delete state.status[k]});save();draftStatus={};draftDate=dk;render();toast("Attendance saved")}
function toggleHoliday(dk){if(!editable(dk))return;state.holidays[dk]?delete state.holidays[dk]:state.holidays[dk]=true;save();render()}
function setNote(dk,text){if(!editable(dk))return;if(text.trim())state.notes[dk]=text.trim();else delete state.notes[dk];save();toast("Note saved")}
function rangeEnd(){return today()}
function compute(filter="all"){let out={attended:0,absent:0,leave:0,notHeld:0,pending:0,total:0,holiday:0,subjects:{}};subjects().forEach(s=>out.subjects[s]={attended:0,absent:0,leave:0,notHeld:0,pending:0,total:0});let cur=new Date(START_DATE),end=rangeEnd();while(cur<=end){if(filter!=="all"&&key(cur).slice(0,7)!==filter){cur=add(cur,1);continue}let dk=key(cur),ss=sessionsFor(cur);if(ss.length){if(state.holidays[dk])out.holiday++;else ss.forEach((x,i)=>{let s=x[2],st=statusOf(dk,i);if(!out.subjects[s])out.subjects[s]={attended:0,absent:0,leave:0,notHeld:0,pending:0,total:0};out.total++;out.subjects[s].total++;if(st===STATUS.ATTENDED){out.attended++;out.subjects[s].attended++}else if(st===STATUS.ABSENT){out.absent++;out.subjects[s].absent++}else if(st===STATUS.LEAVE){out.leave++;out.subjects[s].leave++}else if(st===STATUS.NOT_HELD){out.notHeld++;out.subjects[s].notHeld++}else{out.pending++;out.subjects[s].pending++}})}cur=add(cur,1)}out.rows=Object.entries(out.subjects).map(([subject,x])=>{let held=x.attended+x.absent+x.leave,pct=held?x.attended/held*100:null;return {subject,...x,held,pct}});out.held=out.attended+out.absent+out.leave;out.percent=out.held?out.attended/out.held*100:null;return out}
function dayProgress(d){let dk=key(d),ss=sessionsFor(d);if(state.holidays[dk])return {total:0,marked:0};let marked=ss.filter((_,i)=>!!statusOf(dk,i)).length;return {total:ss.length,marked}}
function header(){return `<div class="header"><div class="brand">▣ Attendance</div><p class="sub">7 Sep 2026 onwards · ${esc(state.settings.course)}</p><p class="sub">Personal attendance tracker</p></div>`}
function dateControls(){let d=parseKey(state.viewDate);return `<div class="card datebar"><button class="iconbtn" data-act="prev">‹</button><button data-act="pickDate" style="background:transparent;color:var(--ink);border:0" class="datecenter"><b>${DAYS[d.getDay()]}</b><span>${fmt(d)} · 📅</span></button><button class="iconbtn" data-act="next">›</button></div><div class="row" style="margin-bottom:10px"><button class="btn outline grow" data-act="dateInput">Choose date</button>${key(d)!==key(today())?`<button class="btn soft" data-act="today">Today</button>`:""}</div>`}
function logTab(){let d=parseKey(state.viewDate),dk=key(d),ss=sessionsFor(d),past=d<today(),future=d>today(),can=editable(dk),before=!past&&!future&&!can,isHoliday=!!state.holidays[dk],p=dayProgress(d);let h=dateControls();if(d<START_DATE)return h+`<div class="banner lock">🔒 Attendance tracking starts on 7 Sep 2026.</div>`;if(ss.length)h+=`<div class="card progressCard"><div class="progressHead"><b>Today's progress</b><span class="progressText">${isHoliday?"Holiday":p.marked+" / "+p.total+" marked"}</span></div><div class="progress"><i style="width:${p.total?p.marked/p.total*100:0}%"></i></div></div>`;if(before)h+=`<div class="banner warn">🕕 Logging opens at ${state.settings.unlockHour}:00 AM.</div>`;else if(past)h+=`<div class="banner lock">🔒 This day has passed. Its data is permanently locked.</div>`;else if(future)h+=`<div class="banner lock">🔒 Future date — it becomes editable when that day arrives.</div>`;else h+=`<div class="banner info">✓ Today is editable until midnight.</div>`;if(!ss.length)return h+`<div class="card formCard" style="text-align:center;color:var(--soft)">No classes scheduled — Sunday.</div>`;h+=`<button class="holiday" data-act="holiday" ${can?"":"disabled"}>${isHoliday?"🏖 Marked as holiday"+(can?" — tap to undo":""):can?"🏖 Mark whole day as holiday":"🔒 Not a holiday"}</button>`;if(!isHoliday){ss.forEach((s,i)=>{let cur=draftValue(sessionKey(dk,i)),locked=can?"":"disabled";h+=`<div class="card session"><div class="sessionTop"><div><div class="sessionName">${esc(s[2])}</div><div class="sessionTime">${time(s[0])} – ${time(s[1])}</div></div>${!can?`<div class="locktag">${past?"🔒 Locked":future?"🔒 Future":"🕕 Opens later"}</div>`:""}</div><div class="statusRow"><button ${locked} data-act="status" data-k="${sessionKey(dk,i)}" data-v="attended" class="status green ${cur==="attended"?"active":""}"><span class="statusIcon">✓</span>Present</button><button ${locked} data-act="status" data-k="${sessionKey(dk,i)}" data-v="absent" class="status red ${cur==="absent"?"active":""}"><span class="statusIcon">✕</span>Absent</button><button ${locked} data-act="status" data-k="${sessionKey(dk,i)}" data-v="not_held" class="status gray ${cur==="not_held"?"active":""}"><span class="statusIcon">⊘</span>Not Held</button></div></div>`});if(can&&Object.keys(draftStatus).length){h+=`<button class="saveAttendance" data-act="saveAttendance">💾 Save attendance</button>`}h+=`<div class="card noteBox"><h3>📝 Note for this day</h3><textarea id="dayNote" ${can?"":"disabled"} placeholder="Optional note...">${esc(state.notes[dk]||"")}</textarea>${can?`<div style="margin-top:8px"><button class="btn soft" data-act="saveNote">Save note</button></div>`:""}</div>`}else h+=`<div class="card formCard" style="text-align:center">🏖 Classes are excluded from attendance calculations for this holiday.</div>`;return h}
function attendanceAdvice(r){let req=Number(state.settings.required)/100;if(!r.held)return `<span class="small">No held classes yet</span>`;if(r.pct>=req){let miss=Math.floor((r.attended-req*r.held)/req+1e-9);return `<span class="safe">🟢 Safe · can miss ${Math.max(0,miss)} more class${miss===1?"":"es"}</span>`}let need=Math.ceil((req*r.held-r.attended)/(1-req)-1e-9);return `<span class="danger">🔴 Below ${state.settings.required}% · attend next ${Math.max(0,need)} class${need===1?"":"es"}</span>`}
function statsTab(){let filter=state.statsFilter,st=compute(filter),pct=st.percent===null?0:Math.min(100,st.percent),months=[];let c=new Date(START_DATE.getFullYear(),START_DATE.getMonth(),1),e=new Date(today().getFullYear(),today().getMonth(),1);while(c<=e){months.push(key(c).slice(0,7));c=new Date(c.getFullYear(),c.getMonth()+1,1)}let h=`<div class="tabs"><button class="filter ${filter==="all"?"active":""}" data-act="filter" data-v="all">Overall</button>${months.slice().reverse().map(m=>`<button class="filter ${filter===m?"active":""}" data-act="filter" data-v="${m}">${parseKey(m+"-01").toLocaleDateString("en-GB",{month:"short",year:"2-digit"})}</button>`).join("")}</div><div class="card statsHero"><div class="ring" style="--p:${pct}%"><div class="ringIn">${st.percent===null?"—":st.percent.toFixed(1)+"%"}</div></div><b>Overall attendance</b><div class="small">${st.attended} present of ${st.held} held classes</div></div><div class="grid4"><div class="card metric"><b>${st.attended}</b><span>Present</span></div><div class="card metric"><b>${st.absent}</b><span>Absent</span></div><div class="card metric"><b>${st.pending}</b><span>Pending</span></div></div><div class="sectionTitle">📚 Subject attendance</div>`;st.rows.forEach(r=>{let cls=r.pct===null?"":r.pct>=state.settings.required?"safe":r.pct>=state.settings.required-5?"warning":"danger";h+=`<div class="card subject"><div class="subjectHead"><div class="subjectName">${esc(r.subject)}</div><div class="pct ${cls}">${r.pct===null?"—":r.pct.toFixed(1)+"%"}</div></div><div class="bar"><i style="width:${r.pct||0}%"></i></div><div class="subjectMeta"><span>Present ${r.attended} · Absent ${r.absent}</span><span>Held ${r.held}</span></div><div style="font-size:11px;margin-top:8px">${attendanceAdvice(r)}</div></div>`});h+=`<p class="small" style="text-align:center;margin:18px 0">Required attendance: ${state.settings.required}% · Not held and holidays are excluded.</p>`;return h}
function calendarTab(){let m=parseKey(state.calendarMonth),y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1),start=first.getDay(),days=new Date(y,mo+1,0).getDate();let h=`<div class="card calendar"><div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn outline" data-act="calPrev">‹</button><b>${monthFmt(first)}</b><button class="btn outline" data-act="calNext">›</button></div><div class="calGrid">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="calDow">${x}</div>`).join("")}${Array.from({length:start},()=>`<div class="calDay empty"></div>`).join("")}`;for(let n=1;n<=days;n++){let d=new Date(y,mo,n),dk=key(d),ss=sessionsFor(d),dot="";if(state.holidays[dk])dot="holiday";else if(ss.length){let vals=ss.map((_,i)=>statusOf(dk,i));if(vals.some(v=>v===STATUS.ABSENT||v===STATUS.LEAVE))dot=vals.some(v=>v===STATUS.ATTENDED)?"mix":"bad";else if(vals.some(v=>v===STATUS.ATTENDED))dot="good"}h+=`<button class="calDay ${dk===key(today())?"today":""}" data-act="calPick" data-v="${dk}">${n}${dot?`<i class="dot ${dot}"></i>`:""}</button>`}h+=`</div></div><div class="banner info">🟢 Present · 🔴 Absent · 🟡 Mixed · 🟣 Holiday. Tap a date to open its log.</div>`;return h}
function settingsTab(){let s=state.settings;return `<div class="card formCard"><b>⚙️ Settings</b><label class="label">Name</label><input id="setName" class="input" value="${esc(s.name)}"><label class="label">Course / Academic part</label><input id="setCourse" class="input" value="${esc(s.course)}"><label class="label">Minimum required attendance (%)</label><input id="setRequired" class="input" type="number" min="1" max="100" value="${s.required}"><p class="small" style="margin-top:12px">🔒 Attendance logging time is fixed at 6:00 AM and cannot be changed.</p><label class="label">Appearance</label><select id="setTheme" class="input"><option value="system" ${s.theme==="system"?"selected":""}>System default</option><option value="light" ${s.theme==="light"?"selected":""}>Light</option><option value="dark" ${s.theme==="dark"?"selected":""}>Dark</option></select><div style="margin-top:14px"><button class="btn" data-act="saveSettings">Save settings</button></div></div><div class="card formCard"><b>💾 Backup & Restore</b><p class="small">Your attendance is stored locally on this device. Keep backups before changing phones or reinstalling the app.</p><div class="row"><button class="btn soft grow" data-act="export">Export backup</button><button class="btn outline grow" data-act="import">Restore backup</button></div><input id="backupFile" type="file" accept="application/json" class="hidden"></div><div class="card formCard"><b>📚 Schedule</b><p class="small">Your current weekly schedule is used for attendance and statistics.</p><button class="btn outline" data-act="schedule">Manage schedule</button></div><p class="small" style="text-align:center">Tracking starts on 7 Sep 2026 and continues indefinitely.</p>`}
function scheduleModal(){let s=state.settings.schedule;let body=`<div class="modal" data-act="closeModal"><div class="modalBox" onclick="event.stopPropagation()"><div class="row" style="justify-content:space-between"><b>Manage weekly schedule</b><button class="btn outline" data-act="closeModal">Close</button></div><p class="small">Edit times and subjects. Changes affect future calculations and the schedule displayed in the app.</p>`;for(let day=1;day<=6;day++){body+=`<div class="formCard card"><b>${DAYS[day]}</b><div id="sch${day}">${(s[day]||[]).map((x,i)=>scheduleRow(day,i,x)).join("")}</div><button class="btn soft" data-act="addSession" data-day="${day}">+ Add class</button></div>`}body+=`<div class="row"><button class="btn grow" data-act="saveSchedule">Save schedule</button><button class="btn outline" data-act="closeModal">Cancel</button></div></div></div>`;document.body.insertAdjacentHTML("beforeend",body)}
function scheduleRow(day,i,x){return `<div class="row" style="margin:8px 0"><input class="input schStart" style="width:82px" type="time" value="${x[0]}"><input class="input schEnd" style="width:82px" type="time" value="${x[1]}"><input class="input schSubject grow" value="${esc(x[2])}"><button class="btn outline" data-act="removeSession" data-day="${day}">×</button></div>`}
function footer(){return `<div class="madeby">Made By Sharad Sourav</div>`}
function bottom(){let items=[["log","▣","Log"],["calendar","▦","Calendar"],["stats","▥","Stats"],["settings","⚙","Settings"]];return `<div class="nav">${items.map(x=>`<button class="${state.tab===x[0]?"active":""}" data-act="tab" data-v="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join("")}</div>`}
function render(){applyTheme();let content=state.tab==="log"?logTab():state.tab==="stats"?statsTab():state.tab==="calendar"?calendarTab():settingsTab();document.getElementById("app").innerHTML=`<div class="app">${header()}<main class="container">${content}${footer()}</main>${bottom()}</div>`}
function toast(msg){let old=document.querySelector(".toast");if(old)old.remove();let x=document.createElement("div");x.className="toast";x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function datePicker(){
  // Use a visible date control inside a modal. Some Android WebViews (including
  // certain AppGeyser builds) do not open a programmatically-clicked hidden date input.
  const modal=document.createElement("div");
  modal.className="modal";
  modal.innerHTML=`<div class="modalBox" role="dialog" aria-modal="true">
    <h2 style="margin:0 0 14px;font-size:19px">Choose date</h2>
    <label class="label" for="pickerDate">Attendance date</label>
    <input id="pickerDate" class="input" type="date" min="${key(START_DATE)}" value="${state.viewDate}">
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="btn outline" data-act="closeModal">Cancel</button>
      <button class="btn" data-act="confirmDate">Open date</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}
function exportBackup(){let data={app:"Attendance Tracker",version:2,exportedAt:new Date().toISOString(),data:state};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="Attendance_Tracker_Backup_"+key(today())+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Backup exported")}
function importBackup(){document.getElementById("backupFile").click()}
document.addEventListener("click",e=>{let el=e.target.closest("[data-act]");if(!el)return;let a=el.dataset.act;if(a==="tab"){draftDate=null;draftStatus={};state.tab=el.dataset.v;save();render()}else if(a==="prev"){draftDate=null;draftStatus={};let d=add(parseKey(state.viewDate),-1);state.viewDate=key(d<START_DATE?START_DATE:d);save();render()}else if(a==="next"){draftDate=null;draftStatus={};state.viewDate=key(add(parseKey(state.viewDate),1));save();render()}else if(a==="today"){draftDate=null;draftStatus={};state.viewDate=key(today());save();render()}else if(a==="pickDate"||a==="dateInput")datePicker();else if(a==="confirmDate"){let inp=document.getElementById("pickerDate");if(inp&&inp.value){draftDate=null;draftStatus={};state.viewDate=inp.value;state.tab="log";save();document.querySelectorAll(".modal").forEach(m=>m.remove());render()}}else if(a==="status")setStatus(el.dataset.k,el.dataset.v);else if(a==="saveAttendance")saveAttendance(state.viewDate);else if(a==="holiday")toggleHoliday(state.viewDate);else if(a==="saveNote")setNote(state.viewDate,document.getElementById("dayNote").value);else if(a==="filter"){state.statsFilter=el.dataset.v;render()}else if(a==="calPrev"){let d=parseKey(state.calendarMonth);state.calendarMonth=key(new Date(d.getFullYear(),d.getMonth()-1,1));save();render()}else if(a==="calNext"){let d=parseKey(state.calendarMonth);state.calendarMonth=key(new Date(d.getFullYear(),d.getMonth()+1,1));save();render()}else if(a==="calPick"){draftDate=null;draftStatus={};state.viewDate=el.dataset.v;state.tab="log";save();render()}else if(a==="saveSettings"){state.settings.name=document.getElementById("setName").value.trim()||"Student";state.settings.course=document.getElementById("setCourse").value.trim()||"Course";state.settings.required=Math.max(1,Math.min(100,Number(document.getElementById("setRequired").value)||75));state.settings.unlockHour=6;state.settings.theme=document.getElementById("setTheme").value;save();applyTheme();render();toast("Settings saved")}else if(a==="export")exportBackup();else if(a==="import")importBackup();else if(a==="schedule")scheduleModal();else if(a==="closeModal"){document.querySelectorAll(".modal").forEach(m=>m.remove())}else if(a==="addSession"){let box=document.getElementById("sch"+el.dataset.day),i=box.children.length;box.insertAdjacentHTML("beforeend",scheduleRow(el.dataset.day,i,["09:00","10:00","New Subject"]))}else if(a==="removeSession"){el.parentElement.remove()}else if(a==="saveSchedule"){let ns={};for(let day=1;day<=6;day++){ns[day]=[...document.querySelectorAll("#sch"+day+" > div")].map(r=>[r.querySelector(".schStart").value,r.querySelector(".schEnd").value,r.querySelector(".schSubject").value.trim()]).filter(x=>x[0]&&x[1]&&x[2])}state.settings.schedule=ns;save();document.querySelectorAll(".modal").forEach(m=>m.remove());render();toast("Schedule saved")}});
document.addEventListener("change",e=>{if(e.target.id==="backupFile"&&e.target.files[0]){let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!d.status||!d.holidays)throw Error();if(!confirm("Restore this backup? It will replace the current app data."))return;state={...defaultState(),...d};state.settings={...defaultState().settings,...(d.settings||{})};save();render();toast("Backup restored")}catch(err){alert("This backup file is not valid.")}};r.readAsText(f)}});
function checkDay(){let cur=key(today());if(state.viewDate<key(START_DATE))state.viewDate=key(START_DATE);render()}document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkDay()});window.addEventListener("focus",checkDay);setInterval(checkDay,60000);load();applyTheme();render();if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
